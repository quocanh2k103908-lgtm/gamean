<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dino Game</title>

<style>
body{margin:0;overflow:hidden;font-family:Arial;}
canvas{display:block;}

.menu{
    position:absolute;
    top:40%;
    left:50%;
    transform:translateX(-50%);
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="startMenu" class="menu">
    <h2>Dino Game</h2>
    <button onclick="startGame()">Start</button>
</div>

<div id="gameOverMenu" class="menu" style="display:none;">
    <h2>Game Over</h2>
    <p id="finalScore"></p>
    <button onclick="restart()">Chơi lại</button>
</div>

<div id="questionBox" class="menu" style="display:none;"></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let groundY = 0;

// ===== RESIZE =====
function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// ===== ẢNH =====
const playerImg = new Image(); playerImg.src="player.png";
const spike1Img = new Image(); spike1Img.src="gai1.png";
const spike2Img = new Image(); spike2Img.src="gai2.png";

// ===== BACKGROUND =====
const bgList = ["bg1.png","bg2.png","bg3.png","bg4.png","bg5.png","bg6.png","bg7.png"];
const groundList = [105,105,105,105,105,105,105];

const bgImages = bgList.map(src=>{
    let img=new Image(); img.src=src; return img;
});

let bgIndex=0,currentBg=bgImages[0],nextBg=null;
let bgX=0,bgSpeed=2;
let fadeAlpha=0,isFading=false;

// ===== PLAYER =====
let player={x:100,y:0,w:80,h:80,vy:0,jumping:false};
let gravity=1;

// ===== GAME =====
let obstacles=[],nextSpawn=0;
let score=0,lives=3,asking=false,gameRunning=false;

// ===== QUIZ =====
let currentIndex=0;
let currentQ=null;

const questions = [
{q:"Cụ Phó bảng Nguyễn Sinh Sắc sinh năm nào và quê ở đâu?", options:["1862 – Nghệ An","1863 – Nam Định","1862 – Hà Tĩnh","1863 – Nghệ An"], correct:3},
{q:"Thân mẫu của Chủ tịch Hồ Chí Minh là ai?", options:["Hoàng Thị Loan","Nguyễn Thị Thanh","Lê Thị Huệ","Trương Thị Thử"], correct:0},
{q:"Năm 1901 cụ đỗ học vị gì?", options:["Tiến sĩ","Phó bảng","Cử nhân","Tú tài"], correct:1},
{q:"Cụ từng làm quan gì ở Bình Khê?", options:["Tri phủ","Tri huyện","Đốc học","Thừa phái"], correct:1},
{q:"Sau khi từ quan cụ làm gì?", options:["Buôn bán","Dạy học + bốc thuốc","Làm quan tiếp","Đi Pháp"], correct:1},
{q:"Cụ mất tại đâu?", options:["Sa Đéc","Cao Lãnh","Lấp Vò","Hồng Ngự"], correct:1},
{q:"Ngày mất của cụ?", options:["27/10 AL","26/11 DL","19/5 DL","Cả A và B"], correct:3},
{q:"Khu di tích nằm ở đường nào?", options:["Phạm Hữu Lầu","Nguyễn Huệ","Lý Thường Kiệt","Lê Lợi"], correct:0},
{q:"Công trình nổi bật nhất?", options:["Tượng đài","Mộ vòm sò","Nhà sàn","Bảo tàng"], correct:1},
{q:"Có bao nhiêu con rồng?", options:["5","7","9","11"], correct:2},
{q:"Ý nghĩa 9 con rồng?", options:["Danh vọng","Cửu Long","Con cái","Trang trí"], correct:1},
{q:"Công trình mô phỏng Hà Nội?", options:["Chùa Một Cột","Lăng Bác","Nhà sàn + ao cá","Văn Miếu"], correct:2},
{q:"Xếp hạng quốc gia năm nào?", options:["1975","1992","2000","2010"], correct:1},
{q:"Ngày giỗ cụ?", options:["27/10 AL","19/5","2/9","10/3"], correct:0},
{q:"Làng Hòa An xưa dùng để làm gì?", options:["Ẩm thực","Tái hiện đời sống","Giải trí","Họp"], correct:1}
];

// ===== JUMP =====
function jump(){
    if(!player.jumping && !asking && gameRunning){
        player.vy=-20;
        player.jumping=true;
    }
}

document.addEventListener("keydown",e=>{
    if(e.code==="Space") jump();
});
canvas.addEventListener("mousedown",jump);
canvas.addEventListener("touchstart",e=>{
    e.preventDefault();
    jump();
});

// ===== START =====
function startGame(){
    document.getElementById("startMenu").style.display="none";

    bgIndex=0;
    currentBg=bgImages[0];
    updateGround();

    player.y=groundY-player.h;

    obstacles=[];
    score=0;
    lives=3;
    nextSpawn=0;
    currentIndex=0;

    gameRunning=true;
}

// ===== RESET =====
function restart(){
    document.getElementById("gameOverMenu").style.display="none";
    startGame();
}

// ===== GROUND =====
function updateGround(){
    groundY=canvas.height-groundList[bgIndex];
}

// ===== UPDATE =====
function update(){
    if(!gameRunning || asking) return;

    player.vy+=gravity;
    player.y+=player.vy;

    if(player.y>=groundY-player.h){
        player.y=groundY-player.h;
        player.jumping=false;
    }

    bgX-=bgSpeed;
    if(bgX<=-canvas.width) bgX=0;

    if(nextSpawn<=0){
        let isDouble=Math.random()<0.5;

        obstacles.push({
            x:canvas.width,
            y:groundY-60,
            w:isDouble?100:50,
            h:60,
            type:isDouble?2:1
        });

        nextSpawn=Math.random()*400+300;
    }

    obstacles.forEach(o=>o.x-=7);
    nextSpawn-=7;

    for(let o of obstacles){
        if(player.x<o.x+o.w &&
           player.x+player.w>o.x &&
           player.y<o.y+o.h &&
           player.y+player.h>o.y){
            gameOver();
        }
    }

    score++;

    // đổi nền
    if(score%300===0 && !isFading){
        bgIndex=(bgIndex+1)%bgImages.length;
        nextBg=bgImages[bgIndex];
        isFading=true;
        fadeAlpha=0;
        updateGround();
    }

    if(isFading){
        fadeAlpha+=0.02;
        if(fadeAlpha>=1){
            currentBg=nextBg;
            isFading=false;
        }
    }

    if(score%500===0 && !asking){
        askQuestion();
    }
}

// ===== DRAW =====
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(currentBg,bgX,0,canvas.width,canvas.height);
    ctx.drawImage(currentBg,bgX+canvas.width,0,canvas.width,canvas.height);

    if(isFading && nextBg){
        ctx.globalAlpha=fadeAlpha;
        ctx.drawImage(nextBg,bgX,0,canvas.width,canvas.height);
        ctx.drawImage(nextBg,bgX+canvas.width,0,canvas.width,canvas.height);
        ctx.globalAlpha=1;
    }

    ctx.drawImage(playerImg,player.x,player.y,player.w,player.h);

    obstacles.forEach(o=>{
        if(o.type===1){
            ctx.drawImage(spike1Img,o.x,o.y,o.w,o.h);
        }else{
            ctx.drawImage(spike2Img,o.x,o.y,o.w,o.h);
        }
    });

    ctx.fillStyle="black";
    ctx.font="24px Arial";
    ctx.fillText("Score: "+score,20,40);
    ctx.fillText("❤️".repeat(lives),20,80);
}

// ===== LOOP =====
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

// ===== GAME OVER =====
function gameOver(){
    gameRunning=false;
    document.getElementById("gameOverMenu").style.display="block";
    document.getElementById("finalScore").innerText="Score: "+score;
}

// ===== QUIZ =====
function askQuestion(){
    asking=true;

    currentQ=questions[currentIndex];

    let box=document.getElementById("questionBox");

    let html=`<p>${currentQ.q}</p>`;
    currentQ.options.forEach((opt,i)=>{
        html+=`<button onclick="answer(${i})">${opt}</button><br>`;
    });

    box.innerHTML=html;
    box.style.display="block";
}

function answer(i){
    asking=false;
    document.getElementById("questionBox").style.display="none";

    if(i!==currentQ.correct){
        lives--;
        if(lives<=0){
            restart();
            return;
        }
    }

    currentIndex++;

    if(currentIndex>=questions.length){
        alert("🎉 Bạn đã hoàn thành 15 câu!");
        restart();
    }
}
</script>

</body>
</html>
