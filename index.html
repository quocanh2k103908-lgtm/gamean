<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dino Quiz - Cụ Phó bảng Nguyễn Sinh Sắc</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #000; touch-action: none; }
        canvas { display: block; background: #fff; }

        /* Thông báo xoay ngang */
        @media screen and (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }
        #rotate-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; z-index: 1000;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        /* Giao diện Menu */
        .menu-box {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); padding: 25px; border-radius: 15px;
            text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.5); z-index: 100;
            width: 80%; max-width: 450px;
        }

        h2 { color: #2c3e50; margin: 0 0 15px 0; }
        
        button {
            padding: 12px 24px; font-size: 16px; cursor: pointer; margin: 8px;
            border-radius: 8px; border: none; background: #27ae60; color: white;
            font-weight: bold; transition: 0.2s;
        }
        button:active { transform: scale(0.95); background: #219150; }

        /* Hộp câu hỏi */
        #questionBox { display: none; text-align: left; }
        #questionBox button { 
            width: 100%; text-align: left; background: #f1f1f1; color: #333; 
            margin-bottom: 8px; padding: 12px; font-weight: normal;
        }
        #questionBox button:hover { background: #e0e0e0; }
    </style>
</head>
<body>

<div id="rotate-overlay">
    <h2>📱 Vui lòng xoay ngang điện thoại</h2>
    <p>Để có trải nghiệm chơi game tốt nhất!</p>
</div>

<canvas id="gameCanvas"></canvas>

<!-- Menu Bắt đầu -->
<div id="startMenu" class="menu-box">
    <h2>Dino Game Quiz</h2>
    <p>Chủ đề: Cuộc đời cụ Phó bảng Nguyễn Sinh Sắc</p>
    <button onclick="startGame()">BẮT ĐẦU CHƠI</button>
</div>

<!-- Menu Kết thúc -->
<div id="gameOverMenu" class="menu-box" style="display:none;">
    <h2 id="endStatus">KẾT THÚC</h2>
    <p id="finalScore"></p>
    <button onclick="restart()">CHƠI LẠI</button>
</div>

<!-- Hộp câu hỏi -->
<div id="questionBox" class="menu-box"></div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- CẤU HÌNH HỆ THỐNG ---
let gameRunning = false;
let asking = false;
let score = 0;
let lives = 3;
let groundY = 0;
const groundOffset = 100; 

// Nhân vật & Vật lý
let player = { x: 80, y: 0, w: 70, h: 70, vy: 0, jumping: false };
const gravity = 0.8; // Trọng lực nhẹ nhàng
const jumpForce = -18; // Lực nhảy vừa phải

// Tốc độ & Hình ảnh
const speed = 4; 
const bgFiles = ["bg1.png", "bg2.png", "bg3.png", "bg4.png", "bg5.png"];
let bgImages = [];
let currentBgIdx = 0;
let bgX = 0;
let obstacles = [];
let nextSpawn = 0;

// Load Resource
function loadImg(src) {
    let img = new Image();
    img.src = src;
    return img;
}
const playerImg = loadImg("player.png");
const spike1Img = loadImg("gai1.jpg");
const spike2Img = loadImg("gai2.png");
bgImages = bgFiles.map(src => loadImg(src));

// --- DỮ LIỆU CÂU HỎI ---
let currentIndex = 0;
const questions = [
    {q:"Cụ Phó bảng Nguyễn Sinh Sắc sinh năm nào và quê ở đâu?", options:["1862 – Nghệ An","1863 – Nam Định","1862 – Hà Tĩnh","1863 – Nghệ An"], correct:3},
    {q:"Thân mẫu của Chủ tịch Hồ Chí Minh là ai?", options:["Hoàng Thị Loan","Nguyễn Thị Thanh","Lê Thị Huệ","Trương Thị Thử"], correct:0},
    {q:"Năm 1901 cụ đỗ học vị gì?", options:["Tiến sĩ","Phó bảng","Cử nhân","Tú tài"], correct:1},
    {q:"Cụ từng làm quan gì ở Bình Khê?", options:["Tri phủ","Tri huyện","Đốc học","Thừa phái"], correct:1},
    {q:"Sau khi từ quan cụ làm gì?", options:["Buôn bán","Dạy học + bốc thuốc","Làm quan tiếp","Đi Pháp"], correct:1},
    {q:"Cụ mất tại đâu?", options:["Sa Đéc","Cao Lãnh","Lấp Vò","Hồng Ngự"], correct:1},
    {q:"Ngày mất của cụ?", options:["27/10 AL","26/11 DL","19/5 DL","Cả A và B"], correct:3},
    {q:"Khu di tích nằm ở đường nào?", options:["Phạm Hữu Lầu","Nguyễn Huệ","Lý Thường Kiệt","Lê Lợi"], correct:0},
    {q:"Công trình nổi bật nhất?", options:["Tượng đài","Mộ vòm sò","Nhà sàn","Bảo tàng"], correct:1},
    {q:"Có bao nhiêu con rồng?", options:["5","7","9","11"], correct:2},
    {q:"Ý nghĩa 9 con rồng?", options:["Danh vọng","Cửu Long","Con cái","Trang trí"], correct:1},
    {q:"Công trình mô phỏng Hà Nội?", options:["Chùa Một Cột","Lăng Bác","Nhà sàn + ao cá","Văn Miếu"], correct:2},
    {q:"Xếp hạng quốc gia năm nào?", options:["1975","1992","2000","2010"], correct:1},
    {q:"Ngày giỗ cụ?", options:["27/10 AL","19/5","2/9","10/3"], correct:0},
    {q:"Làng Hòa An xưa dùng để làm gì?", options:["Ẩm thực","Tái hiện đời sống","Giải trí","Họp"], correct:1}
];

// --- LOGIC GAME ---
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    groundY = canvas.height - groundOffset;
    if (!player.jumping) player.y = groundY - player.h;
}
window.addEventListener("resize", resize);
resize();

function jump() {
    if (!player.jumping && gameRunning && !asking) {
        player.vy = jumpForce;
        player.jumping = true;
    }
}

function startGame() {
    score = 0; lives = 3; currentIndex = 0; currentBgIdx = 0;
    obstacles = []; gameRunning = true; asking = false;
    document.getElementById("startMenu").style.display = "none";
    document.getElementById("gameOverMenu").style.display = "none";
    resize();
}

function restart() { startGame(); }

function askQuestion() {
    asking = true;
    let q = questions[currentIndex];
    let box = document.getElementById("questionBox");
    box.innerHTML = `<h3>Câu ${currentIndex + 1}/15</h3><p>${q.q}</p>` + 
        q.options.map((opt, i) => `<button onclick="handleAnswer(${i})">${opt}</button>`).join("");
    box.style.display = "block";
}

function handleAnswer(idx) {
    if (idx !== questions[currentIndex].correct) lives--;
    currentIndex++;
    asking = false;
    document.getElementById("questionBox").style.display = "none";
    
    if (lives <= 0) endGame("Bạn đã hết mạng!");
    else if (currentIndex >= questions.length) endGame("Xuất sắc! Bạn đã hoàn thành 15 câu hỏi!");
}

function endGame(msg) {
    gameRunning = false;
    document.getElementById("gameOverMenu").style.display = "block";
    document.getElementById("endStatus").innerText = msg;
    document.getElementById("finalScore").innerText = "Điểm đạt được: " + score;
}

// --- VÒNG LẶP CHÍNH ---
function update() {
    if (!gameRunning || asking) return;

    // Vật lý nhân vật
    player.vy += gravity;
    player.y += player.vy;
    if (player.y >= groundY - player.h) {
        player.y = groundY - player.h;
        player.jumping = false;
        player.vy = 0;
    }

    // Chuyển động nền
    bgX -= speed;
    if (bgX <= -canvas.width) bgX = 0;

    // Quản lý vật cản
    nextSpawn -= speed;
    if (nextSpawn <= 0) {
        let isDouble = Math.random() > 0.6;
        obstacles.push({ x: canvas.width, y: groundY - 60, w: isDouble ? 90 : 50, h: 60, type: isDouble?2:1 });
        nextSpawn = 500 + Math.random() * 500;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= speed;
        // Va chạm an toàn (padding 12px)
        let p = 12;
        if (player.x + p < obstacles[i].x + obstacles[i].w - p &&
            player.x + player.w - p > obstacles[i].x + p &&
            player.y + p < obstacles[i].y + obstacles[i].h - p &&
            player.y + player.h - p > obstacles[i].y + p) {
            endGame("Hãy cẩn thận hơn nhé!");
        }
        if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
    }

    score++;
    if (score % 1000 === 0) currentBgIdx = (currentBgIdx + 1) % bgImages.length;
    if (score % 700 === 0 && currentIndex < questions.length) askQuestion();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ Background
    let img = bgImages[currentBgIdx];
    if (img.complete) {
        ctx.drawImage(img, bgX, 0, canvas.width, canvas.height);
        ctx.drawImage(img, bgX + canvas.width, 0, canvas.width, canvas.height);
    }

    // Vẽ Vật cản
    obstacles.forEach(o => {
        let sImg = (o.type === 1) ? spike1Img : spike2Img;
        if (sImg.complete) ctx.drawImage(sImg, o.x, o.y, o.w, o.h);
        else { ctx.fillStyle = "red"; ctx.fillRect(o.x, o.y, o.w, o.h); }
    });

    // Vẽ Nhân vật
    if (playerImg.complete) ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
    else { ctx.fillStyle = "#27ae60"; ctx.fillRect(player.x, player.y, player.w, player.h); }

    // Giao diện (UI) thông tin
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(15, 15, 240, 130);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 20px Arial";
    ctx.fillText("Điểm: " + score, 30, 45);
    ctx.fillText("Mạng: " + "❤️".repeat(lives), 30, 85);
    ctx.fillStyle = "#f1c40f";
    ctx.fillText("Đã trả lời: " + currentIndex + "/15", 30, 125);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

// ĐIỀU KHIỂN
window.addEventListener("keydown", e => { if(e.code === "Space" || e.code === "ArrowUp") jump(); });
// Chạm màn hình để nhảy trên điện thoại
canvas.addEventListener("touchstart", e => { 
    e.preventDefault(); 
    jump(); 
}, {passive: false});

loop();
</script>
</body>
</html>
